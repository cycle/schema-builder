---

name: build

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - 2.x
  pull_request: null

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commit-linting:
    name: Lint commits
    if: github.event_name == 'pull_request'
    timeout-minutes: 4
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 🧐 Lint commits using "commitlint"
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: ${{ github.workspace }}/.github/.commitlint.config.mjs
          failOnWarnings: false
          failOnErrors: false
          helpURL: 'https://github.com/conventional-changelog/commitlint/#what-is-commitlint'

  test:
    name: Unit + SQLite, PHP ${{ matrix.php-versions }} (${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-versions: ['8.2', '8.3', '8.4', '8.5']
        dependencies: ['lowest', 'highest']
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 🛠️ Setup PHP ${{ matrix.php-versions }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          coverage: pcov
          extensions: mbstring, pdo, pdo_sqlite

      - name: 🤖 Validate composer.json
        run: composer validate --ansi --strict

      # TODO(cycle/testing): switch to the released package
      - name: 📥 Install dependencies with composer
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: 🚀 Execute Tests
        run: composer test:unit && composer test:sqlite -- --coverage-clover=runtime/clover.xml

      - name: 🦆 Upload coverage to Codecov
        continue-on-error: true # if is fork
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./runtime/clover.xml
          flags: sqlite

  database:
    name: ${{ matrix.driver }}, PHP ${{ matrix.php-versions }} (${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-versions: ['8.2', '8.5']
        dependencies: ['lowest', 'highest']
        driver: [mysql, postgres, sqlserver]
        include:
          - driver: mysql
            extensions: pdo_mysql
          - driver: postgres
            extensions: pdo_pgsql
          - driver: sqlserver
            extensions: sqlsrv, pdo_sqlsrv
    env:
      DB_REQUIRED: 1
    steps:
      - name: Install ODBC driver
        if: matrix.driver == 'sqlserver'
        run: |
          sudo curl https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18

      - name: 📦 Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 🛠️ Setup PHP ${{ matrix.php-versions }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          coverage: pcov
          tools: pecl
          extensions: mbstring, pdo, ${{ matrix.extensions }}

      # TODO(cycle/testing): switch to the released package
      - name: 📥 Install dependencies with composer
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: 🛠️ Start the database
        run: composer db:up -- ${{ matrix.driver }}

      - name: 🚀 Execute Tests
        run: composer test:${{ matrix.driver }} -- --coverage-clover=runtime/clover.xml

      - name: 🦆 Upload coverage to Codecov
        continue-on-error: true # if is fork
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./runtime/clover.xml
          flags: ${{ matrix.driver }}

...
